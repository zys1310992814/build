name: 构建 x86_64 Armbian 服务器版

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: 安装依赖
        run: sudo apt-get update && sudo apt-get install -y debootstrap qemu-user-static binfmt-support
      
      - name: 构建
        run: |
          ./compile.sh \
            BOARD=uefi-x86 \
            BRANCH=current \
            RELEASE=noble \
            BUILD_DESKTOP=no \
            BUILD_MINIMAL=no \
            KERNEL_CONFIGURE=no \
            PROGRESS_DISPLAY=plain
      
      - uses: actions/upload-artifact@v4
        with:
          name: armbian-uefi-x86
          path: output/images/*.img*
