name: 手动构建 Armbian x86_64 (服务器版)

on:
  workflow_dispatch:
    inputs:
      release:
        description: '发行版版本'
        required: true
        default: 'noble'
        type: choice
        options:
          - noble      # Ubuntu 24.04
          - jammy      # Ubuntu 22.04
          - bookworm   # Debian 12

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            debootstrap qemu-user-static binfmt-support \
            dialog whiptail u-boot-tools device-tree-compiler \
            dosfstools fdisk gawk git grep gzip initramfs-tools \
            libssl-dev lsb-release parted pv systemd-container tar xz-utils

      - name: 构建 Armbian 镜像 (明确指定服务器版)
        run: |
          ./compile.sh \
            BOARD=uefi-x86 \
            BRANCH=current \
            RELEASE=${{ github.event.inputs.release }} \
            BUILD_DESKTOP=no \
            BUILD_MINIMAL=no \
            KERNEL_CONFIGURE=no \
            PROGRESS_DISPLAY=plain \
            EXPERT=yes
        env:
          # 再次确保环境变量也生效，双重保险
          DEBIAN_FRONTEND: noninteractive
          KERNEL_CONFIGURE: no
          PROGRESS_DISPLAY: plain
          BUILD_DESKTOP: no
          BUILD_MINIMAL: no

      - name: 上传镜像产物
        uses: actions/upload-artifact@v4
        with:
          name: armbian-x86-server-${{ github.event.inputs.release }}
          path: output/images/*.img*
