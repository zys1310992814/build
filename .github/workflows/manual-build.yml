name: Armbian 构建（确保运行）

on:
  workflow_dispatch:
    inputs:
      release:
        description: '发行版'
        required: true
        default: 'noble'
        type: choice
        options:
          - noble
          - jammy
          - bookworm

# 确保任务一定会运行
jobs:
  build:
    # 移除所有条件判断，或使用 always()
    if: always()
    runs-on: ubuntu-22.04
    # 不设置 needs，不依赖其他任务
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: main  # 明确指定分支
      
      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            debootstrap \
            qemu-user-static \
            binfmt-support
      
      - name: 构建 Armbian
        run: |
          ./compile.sh \
            BOARD=uefi-x86 \
            BRANCH=current \
            RELEASE=${{ github.event.inputs.release }} \
            BUILD_DESKTOP=no \
            KERNEL_CONFIGURE=no \
            PROGRESS_DISPLAY=plain
      
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: armbian-image
          path: output/images/*.img*
