# =============================================================================
# Build Armbian on a FORK via GitHub Actions — 标准构建
# -----------------------------------------------------------------------------
# 说明：
#   * 官方 maintenance-build-artifacts.yml 带 `if: owner=='armbian'` 守卫，且依赖
#     Armbian 自托管 runner（标签 Linux/big/small），在个人 fork 上不会真正执行。
#   * 本工作流绕开上述限制：用 workflow_dispatch（手动）触发，直接 checkout 本仓库
#     并在 runner（默认 ubuntu-latest）上运行 ./compile.sh 完成标准构建。
#   * 不做任何 DTB 注入 / 裁剪：构建出的镜像使用板型 aml-s9xx-box 的默认 DTB，
#     与项目其余 action 的构建动作保持一致，不引入额外修改。
#   * 可选接入官方 fork 转发机制：若仓库设置了密钥 ARMBIAN_SELF_DISPATCH_TOKEN，
#     infrastructure-dispatch-to-fork.yml 会在 push/PR/release 时发出
#     repository_dispatch 事件 "armbian"，本工作流的 repository_dispatch 触发器会响应。
#     注意：开启后每次 push 都会自动触发构建，按需保留。
#   * CI 优化（针对 ubuntu-latest 资源约束）：构建前释放磁盘 + 添加 8G swap，降低
#     完整镜像 OOM/磁盘耗尽概率；workflow 级 concurrency 取消重复触发；产物保留 30 天；
#     失败自动上传 output/logs 便于排查。
#
# 用法：
#   1. 把本文件放到 fork 仓库的 .github/workflows/ 目录下（如 build-on-fork.yml）。
#   2. Settings → Actions → General → 选 "Allow all actions and reusable workflows"。
#   3. Actions 标签页 → 选 "Build Armbian (fork)" → Run workflow → 填 board/branch/release。
#
# 资源提示（完整镜像 / Amlogic）：
#   * GitHub 托管 ubuntu-latest（2 vCPU / 7GB / 磁盘约 14G 可用）几乎必然 OOM 或磁盘耗尽，
#     且 6 小时硬上限经常不够；完整镜像建议用自托管 runner（见 runner 输入）。
#   * 本工作流提供 runner 选择输入：默认 ubuntu-latest（无自托管 runner 时）。
#     在 Settings→Actions→Runners 注册自托管 runner 后，可切换为 ["self-hosted","linux","x64"]。
# =============================================================================

name: "Build Armbian (fork)"
run-name: "Build ${{ inputs.board || 'aml-s9xx-box' }} / ${{ inputs.branch || 'current' }} / ${{ inputs.release || 'bookworm' }}"

on:
  workflow_dispatch:
    inputs:
      board:
        description: "目标板型。Amlogic S9xxx 电视盒子（含 S905X3）用 aml-s9xx-box"
        required: true
        default: "aml-s9xx-box"
      branch:
        description: "内核分支"
        required: true
        default: "current"
        type: choice
        options: [legacy, current, edge]
      release:
        description: "用户空间发行版"
        required: true
        default: "bookworm"
        type: choice
        options: [bullseye, bookworm, trixie, noble]
      build_target:
        description: "构建镜像还是仅内核/U-Boot"
        required: true
        default: "image"
        type: choice
        options: [image, kernel]
      minimal:
        description: "最小镜像（BUILD_MINIMAL）。完整镜像选 no"
        required: true
        default: "no"
        type: choice
        options: ["no", "yes"]
      desktop:
        description: "是否带桌面环境（BUILD_DESKTOP）。完整服务器镜像选 no"
        required: true
        default: "no"
        type: choice
        options: ["no", "yes"]
      runner:
        description: "运行器。无自托管 runner 时选 ubuntu-latest；稳定编完整镜像用自托管"
        required: true
        default: "ubuntu-latest"
        type: choice
        options:
          - '["self-hosted", "linux", "x64"]'
          - "ubuntu-latest"
  # 接入官方 fork 转发机制（可选，按需开启）
  repository_dispatch:
    types: ["armbian"]

permissions:
  contents: read

# 同一 board/branch/release/build_target 配置重复触发时，取消仍在排队的旧 run，
# 避免浪费 ubuntu-latest 的 6 小时额度（官方 CI 也用 concurrency + cancel-in-progress）。
concurrency:
  group: build-armbian-${{ github.ref }}-${{ inputs.board }}-${{ inputs.branch }}-${{ inputs.release }}-${{ inputs.build_target }}
  cancel-in-progress: true

jobs:
  build:
    name: "Build ${{ inputs.board || 'aml-s9xx-box' }}"
    # runner 通过 workflow_dispatch 输入选择；默认 ubuntu-latest（无自托管 runner 时）
    # 用三元把两种输入都转成合法 JSON 再 fromJson：ubuntu-latest -> 字符串，其余 -> 数组
    runs-on: ${{ fromJson(inputs.runner == 'ubuntu-latest' && '"ubuntu-latest"' || '["self-hosted", "linux", "x64"]') }}
    timeout-minutes: 360
    env:
      BOARD: ${{ inputs.board || 'aml-s9xx-box' }}
      BRANCH: ${{ inputs.branch || 'current' }}
      RELEASE: ${{ inputs.release || 'bookworm' }}
      BUILD_MINIMAL: ${{ inputs.minimal || 'no' }}
      BUILD_DESKTOP: ${{ inputs.desktop || 'no' }}
      BUILD_TARGET_VAL: ${{ inputs.build_target || 'image' }}
      KERNEL_CONFIGURE: "no"      # 不自问内核配置，避免交互卡住
      IGNORE_UPDATES: "yes"       # 跳过版本更新检查
      NO_APT_CACHER: "yes"        # 不使用 apt-cacher
      USE_TORRENT: "no"           # 不用 torrent 下载
      SHOW_LOG: "yes"
      BETA: "yes"                 # 允许构建（非稳定分支）
      DEBIAN_FRONTEND: "noninteractive"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk space (avoid full-image build running out of space)
        # ubuntu-latest 仅约 14G 可用磁盘，完整镜像构建（debootstrap + 内核 + 打包）极易占满。
        # 删掉 GitHub 预装但本构建用不到的大型工具链缓存，腾出空间。
        run: |
          sudo rm -rf /opt/hostedtoolcache /usr/share/dotnet /usr/local/lib/android \
                       /usr/local/share/powershell /usr/local/go /usr/share/swift
          sudo apt-get clean
          df -h

      - name: Add swap (mitigate OOM for full image build on 7GB runner)
        # ubuntu-latest 只有 7G 内存，编完整镜像（含打包 xz）常被 OOM kill。
        # 挂 8G swap 兜底，显著降低 OOM 概率（速度会变慢，但能跑完）。
        # 注意：runner 复用或上次运行可能残留一个“已激活”的 /swapfile，直接 fallocate/dd 改写会报
        # “Text file busy”(ETXTBSY)。故重建前先 swapoff 并删除，避免该步骤直接失败退出。
        run: |
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192 status=progress
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Set up QEMU (register binfmt for cross-arch build)
        # 在 amd64 runner 上编 arm64 镜像需要 qemu binfmt 处理器，否则构建容器内
        # update-binfmts / arch-test 失败（"arm64: not supported on this machine/kernel"）。
        # 该 action 用 tonistiigi/binfmt 注册带 F(fix_binary) 标志的处理器，子容器自动继承。
        uses: docker/setup-qemu-action@v3

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential curl git gnupg ca-certificates \
            tzdata pv pigz bison flex bc device-tree-compiler \
            libncurses-dev libssl-dev

      - name: Show build configuration
        run: |
          echo "BOARD=${BOARD} BRANCH=${BRANCH} RELEASE=${RELEASE}"
          echo "BUILD_MINIMAL=${BUILD_MINIMAL} BUILD_DESKTOP=${BUILD_DESKTOP} BUILD_TARGET=${BUILD_TARGET_VAL}"
          echo "(KERNEL_ONLY 已废弃，目标由子命令 ./compile.sh build|kernel 决定)"

      - name: Start build (non-interactive)
        # 所有参数以命令行参数形式传入 ./compile.sh —— Armbian 会 export 它们并带进 Docker 容器，
        # 比单纯 env: 更可靠（env 变量不一定全被转发进容器，导致卡在交互菜单）。
        # 新版 Armbian(26.11+) 已废弃 KERNEL_ONLY 环境变量，改用子命令：
        #   ./compile.sh build  -> 完整镜像(含内核+U-Boot)
        #   ./compile.sh kernel -> 仅内核/U-Boot
        run: |
          if [ "${{ inputs.build_target }}" = "kernel" ]; then
            ./compile.sh kernel \
              BOARD="${BOARD}" \
              BRANCH="${BRANCH}" \
              KERNEL_CONFIGURE="no" \
              IGNORE_UPDATES="yes" \
              NO_APT_CACHER="yes" \
              USE_TORRENT="no" \
              BETA="yes" \
              DEBIAN_FRONTEND="noninteractive"
          else
            ./compile.sh build \
              BOARD="${BOARD}" \
              BRANCH="${BRANCH}" \
              RELEASE="${RELEASE}" \
              BUILD_TARGET="${BUILD_TARGET_VAL}" \
              BUILD_MINIMAL="${BUILD_MINIMAL}" \
              BUILD_DESKTOP="${BUILD_DESKTOP}" \
              KERNEL_CONFIGURE="no" \
              IGNORE_UPDATES="yes" \
              NO_APT_CACHER="yes" \
              USE_TORRENT="no" \
              BETA="yes" \
              DEBIAN_FRONTEND="noninteractive"
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: armbian-${{ inputs.board || 'aml-s9xx-box' }}-${{ inputs.branch || 'current' }}
          path: |
            output/images/*.img*
            output/debs/*.deb
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload debug logs on failure
        # 构建失败时把完整日志打包，方便定位（尤其是交互卡住 / 依赖缺失类问题）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: armbian-logs-${{ inputs.board || 'aml-s9xx-box' }}-${{ inputs.branch || 'current' }}
          path: |
            output/logs/**
          if-no-files-found: ignore
          retention-days: 7
